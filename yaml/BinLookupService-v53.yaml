openapi: 3.1.0
info:
  title: Adyen BinLookup API
  description: "The BIN Lookup API provides endpoints for retrieving information,\
    \ such as cost estimates, and 3D Secure supported version based on a given BIN.\n\
    \n## Authentication\nYou need an [API credential](https://docs.adyen.com/development-resources/api-credentials)\
    \ to authenticate to the API.\n\nIf using an API key, add an `X-API-Key` header\
    \ with the API key as the value, for example:\n\n ```\ncurl\n-H \"Content-Type:\
    \ application/json\" \\\n-H \"X-API-Key: YOUR_API_KEY\" \\\n...\n```\n\nAlternatively,\
    \ you can use the username and password to connect to the API using basic authentication,\
    \ for example:\n\n```\ncurl\n-u \"ws@Company.YOUR_COMPANY_ACCOUNT\":\"YOUR_BASIC_AUTHENTICATION_PASSWORD\"\
    \ \\\n-H \"Content-Type: application/json\" \\\n...\n```\n\n## Versioning\nThe\
    \ BinLookup API supports [versioning](https://docs.adyen.com/development-resources/versioning)\
    \ using a version suffix in the endpoint URL. This suffix has the following format:\
    \ \"vXX\", where XX is the version number.\n\nFor example:\n```\nhttps://pal-test.adyen.com/pal/servlet/BinLookup/v53/get3dsAvailability\n\
    ```\n\n## Going live\n\nTo authenticate to the live endpoints, you need an [API\
    \ credential](https://docs.adyen.com/development-resources/api-credentials) from\
    \ your live Customer Area.\n\nThe live endpoint URLs contain a prefix which is\
    \ unique to your company account:\n```\n\nhttps://{PREFIX}-pal-live.adyenpayments.com/pal/servlet/BinLookup/v53/get3dsAvailability\n\
    ```\n\nGet your `{PREFIX}` from your live Customer Area under **Developers** >\
    \ **API URLs** > **Prefix**."
  termsOfService: https://www.adyen.com/legal/terms-and-conditions
  contact:
    name: Adyen Developer Experience team
    url: https://github.com/Adyen/adyen-openapi
  version: '53'
  x-publicVersion: true
servers:
- url: https://pal-test.adyen.com/pal/servlet/BinLookup/v53
tags:
- name: General
paths:
  /get3dsAvailability:
    post:
      tags:
      - General
      summary: Check if 3D Secure is available
      description: 'Verifies whether 3D Secure is available for the specified BIN
        or card brand. For 3D Secure 2, this endpoint also returns device fingerprinting
        keys.


        For more information, refer to [3D Secure 2](https://docs.adyen.com/online-payments/3d-secure/native-3ds2).'
      operationId: post-get3dsAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDSAvailabilityRequest'
            examples:
              get3dsAvailability:
                $ref: '#/components/examples/post-get3dsAvailability-get3dsAvailability'
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDSAvailabilityResponse'
              examples:
                get3dsAvailability:
                  $ref: '#/components/examples/post-get3dsAvailability-get3dsAvailability-200'
        '400':
          description: Bad Request - a problem reading or understanding the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
              examples:
                generic:
                  $ref: '#/components/examples/generic-400'
        '401':
          description: Unauthorized - authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '403':
          description: Forbidden - insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '422':
          description: Unprocessable Entity - a request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '500':
          description: Internal Server Error - the server could not process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
      security:
      - BasicAuth: []
      - ApiKeyAuth: []
      x-addedInVersion: '1'
      x-sortIndex: 0
      x-methodName: get3dsAvailability
  /getCostEstimate:
    post:
      tags:
      - General
      summary: Get a fees cost estimate
      description: '>This API is available only for merchants operating in Australia,
        the EU, and the UK.


        Use the Adyen Cost Estimation API to pre-calculate interchange and scheme
        fee costs. Knowing these costs prior actual payment authorisation gives you
        an opportunity to charge those costs to the cardholder, if necessary.


        To retrieve this information, make the call to the `/getCostEstimate` endpoint.
        The response to this call contains the amount of the interchange and scheme
        fees charged by the network for this transaction, and also which surcharging
        policy is possible (based on current regulations).


        > Since not all information is known in advance (for example, if the cardholder
        will successfully authenticate via 3D Secure or if you also plan to provide
        additional Level 2/3 data), the returned amounts are based on a set of assumption
        criteria you define in the `assumptions` parameter.'
      operationId: post-getCostEstimate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostEstimateRequest'
            examples:
              getCostEstimate:
                $ref: '#/components/examples/post-getCostEstimate-getCostEstimate'
              getCostEstimateEncryptedCard:
                $ref: '#/components/examples/post-getCostEstimate-getCostEstimateEncryptedCard'
              getCostEstimateMinimal:
                $ref: '#/components/examples/post-getCostEstimate-getCostEstimateMinimal'
              getCostEstimateMinimal3DS:
                $ref: '#/components/examples/post-getCostEstimate-getCostEstimateMinimal3DS'
              getCostEstimateRecurringContract:
                $ref: '#/components/examples/post-getCostEstimate-getCostEstimateRecurringContract'
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostEstimateResponse'
              examples:
                getCostEstimate:
                  $ref: '#/components/examples/post-getCostEstimate-getCostEstimate-200'
                getCostEstimateEncryptedCard:
                  $ref: '#/components/examples/post-getCostEstimate-getCostEstimateEncryptedCard-200'
                getCostEstimateMinimal:
                  $ref: '#/components/examples/post-getCostEstimate-getCostEstimateMinimal-200'
                getCostEstimateMinimal3DS:
                  $ref: '#/components/examples/post-getCostEstimate-getCostEstimateMinimal3DS-200'
        '400':
          description: Bad Request - a problem reading or understanding the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
              examples:
                generic:
                  $ref: '#/components/examples/generic-400'
        '401':
          description: Unauthorized - authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '403':
          description: Forbidden - insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '422':
          description: Unprocessable Entity - a request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '500':
          description: Internal Server Error - the server could not process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
      security:
      - BasicAuth: []
      - ApiKeyAuth: []
      x-sortIndex: 0
      x-methodName: getCostEstimate
components:
  schemas:
    Amount:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          description: The three-character [ISO currency code](https://docs.adyen.com/development-resources/currency-codes#currency-codes)
            of the amount.
          maxLength: 3
          minLength: 3
        value:
          type: integer
          format: int64
          description: The numeric value of the amount, in [minor units](https://docs.adyen.com/development-resources/currency-codes#minor-units).
      required:
      - currency
      - value
    BinDetail:
      type: object
      additionalProperties: false
      properties:
        issuerCountry:
          type: string
          description: The country where the card was issued.
    CardBin:
      type: object
      additionalProperties: false
      properties:
        bin:
          type: string
          description: The first 6 digit of the card number. Enable this field via
            merchant account settings.
        commercial:
          type: boolean
          description: If true, it indicates a commercial card. Enable this field
            via merchant account settings.
        fundingSource:
          type: string
          description: 'The card funding source. Valid values are:

            * CHARGE

            * CREDIT

            * DEBIT

            * DEFERRED_DEBIT

            * PREPAID

            * PREPAID_RELOADABLE

            * PREPAID_NONRELOADABLE

            > Enable this field via merchant account settings.'
        fundsAvailability:
          type: string
          description: 'Indicates availability of funds.


            Visa:

            * "I" (fast funds are supported)

            * "N" (otherwise)


            Mastercard:

            * "I" (product type is Prepaid or Debit, or issuing country is in CEE/HGEM
            list)

            * "N" (otherwise)

            > Returned when you verify a card BIN or estimate costs, and only if `payoutEligible`
            is different from "N" or "U".'
        issuingBank:
          type: string
          description: The issuing bank of the card.
        issuingCountry:
          type: string
          description: The country where the card was issued from.
        issuingCurrency:
          type: string
          description: The currency of the card.
        paymentMethod:
          type: string
          description: The payment method associated with the card (e.g. visa, mc,
            or amex).
        payoutEligible:
          type: string
          description: 'Indicates whether a payout is eligible or not for this card.


            Visa:

            * "Y"

            * "N"


            Mastercard:

            * "Y" (domestic and cross-border)

            * "D" (only domestic)

            * "N" (no MoneySend)

            * "U" (unknown)

            > Returned when you verify a card BIN or estimate costs, and only if `payoutEligible`
            is different from "N" or "U".'
        summary:
          type: string
          description: The last four digits of the card number.
    CostEstimateAssumptions:
      type: object
      additionalProperties: false
      properties:
        assume3DSecureAuthenticated:
          type: boolean
          description: If true, the cardholder is expected to successfully authorise
            via 3D Secure.
        assumeLevel3Data:
          type: boolean
          description: If true, the transaction is expected to have valid Level 3
            data.
        installments:
          type: integer
          format: int32
          description: If not zero, the number of installments.
    CostEstimateRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
          description: The transaction amount used as a base for the cost estimation.
        assumptions:
          $ref: '#/components/schemas/CostEstimateAssumptions'
          description: Assumptions made for the expected characteristics of the transaction,
            for which the charges are being estimated.
        cardNumber:
          type: string
          description: 'The card number (4-19 characters) for PCI compliant use cases.
            Do not use any separators.


            > Either the `cardNumber` or `encryptedCardNumber` field must be provided
            in a payment request.'
          maxLength: 19
          minLength: 4
        encryptedCardNumber:
          type: string
          description: 'Encrypted data that stores card information for non PCI-compliant
            use cases. The encrypted data must be created with the Checkout Card Component
            or Secured Fields Component, and must contain the `encryptedCardNumber`
            field.


            > Either the `cardNumber` or `encryptedCardNumber` field must be provided
            in a payment request.'
        merchantAccount:
          type: string
          description: The merchant account identifier you want to process the (transaction)
            request with.
        merchantDetails:
          $ref: '#/components/schemas/MerchantDetails'
          description: Additional data for merchants who don't use Adyen as the payment
            authorisation gateway.
        recurring:
          $ref: '#/components/schemas/Recurring'
          description: The recurring settings for the payment. Use this property when
            you want to enable [recurring payments](https://docs.adyen.com/online-payments/tokenization).
        selectedRecurringDetailReference:
          type: string
          description: The `recurringDetailReference` you want to use for this cost
            estimate. The value `LATEST` can be used to select the most recently stored
            recurring detail.
        shopperInteraction:
          type: string
          description: 'Specifies the sales channel, through which the shopper gives
            their card details, and whether the shopper is a returning customer.

            For the web service API, Adyen assumes Ecommerce shopper interaction by
            default.


            This field has the following possible values:

            * `Ecommerce` - Online transactions where the cardholder is present (online).
            For better authorisation rates, we recommend sending the card security
            code (CSC) along with the request.

            * `ContAuth` - Card on file and/or subscription transactions, where the
            card holder is known to the merchant (returning customer). If the shopper
            is present (online), you can supply also the CSC to improve authorisation
            (one-click payment).

            * `Moto` - Mail-order and telephone-order transactions where the shopper
            is in contact with the merchant via email or telephone.

            * `POS` - Point-of-sale transactions where the shopper is physically present
            to make a payment using a secure payment terminal.'
          enum:
          - Ecommerce
          - ContAuth
          - Moto
          - POS
        shopperReference:
          type: string
          description: "Required for recurring payments. \nYour reference to uniquely\
            \ identify this shopper, for example user ID or account ID. The value\
            \ is case-sensitive and must be at least three characters.\n> Your reference\
            \ must not include personally identifiable information (PII) such as name\
            \ or email address."
      required:
      - amount
      - merchantAccount
    CostEstimateResponse:
      type: object
      additionalProperties: false
      properties:
        cardBin:
          $ref: '#/components/schemas/CardBin'
          description: Card BIN details.
        costEstimateAmount:
          $ref: '#/components/schemas/Amount'
          description: The estimated cost (scheme fee + interchange) in the settlement
            currency. If the settlement currency cannot be determined, the fee in
            EUR is returned.
        costEstimateReference:
          type: string
          description: Adyen's 16-character reference associated with the request.
          x-addedInVersion: '52'
        resultCode:
          type: string
          description: The result of the cost estimation.
    DSPublicKeyDetail:
      type: object
      additionalProperties: false
      properties:
        brand:
          type: string
          description: Card brand.
        directoryServerId:
          type: string
          description: Directory Server (DS) identifier.
        fromSDKVersion:
          type: string
          description: The version of the mobile 3D Secure 2 SDK. For the possible
            values, refer to the versions in [Adyen 3DS2 Android](https://github.com/Adyen/adyen-3ds2-android/releases)
            and [Adyen 3DS2 iOS](https://github.com/Adyen/adyen-3ds2-ios/releases).
        publicKey:
          type: string
          format: byte
          description: Public key. The 3D Secure 2 SDK encrypts the device information
            by using the DS public key.
        rootCertificates:
          type: string
          description: Directory Server root certificates. The 3D Secure 2 SDK verifies
            the ACS signed content using the rootCertificates.
    MerchantDetails:
      type: object
      additionalProperties: false
      properties:
        countryCode:
          type: string
          description: '2-letter ISO 3166 country code of the card acceptor location.

            > This parameter is required for the merchants who don''t use Adyen as
            the payment authorisation gateway.'
          maxLength: 2
          minLength: 2
        enrolledIn3DSecure:
          type: boolean
          description: If true, indicates that the merchant is enrolled in 3D Secure
            for the card network.
        mcc:
          type: string
          description: 'The merchant category code (MCC) is a four-digit number which
            relates to a particular market segment. This code reflects the predominant
            activity that is conducted by the merchant.


            The list of MCCs can be found [here](https://en.wikipedia.org/wiki/Merchant_category_code).'
    Recurring:
      type: object
      additionalProperties: false
      properties:
        contract:
          type: string
          description: "The type of recurring contract to be used.\nPossible values:\n\
            * `ONECLICK` \u2013 Payment details can be used to initiate a one-click\
            \ payment, where the shopper enters the [card security code (CVC/CVV)](https://docs.adyen.com/payments-fundamentals/payment-glossary#card-security-code-cvc-cvv-cid).\n\
            * `RECURRING` \u2013 Payment details can be used without the card security\
            \ code to initiate [card-not-present transactions](https://docs.adyen.com/payments-fundamentals/payment-glossary#card-not-present-cnp).\n\
            * `ONECLICK,RECURRING` \u2013 Payment details can be used regardless of\
            \ whether the shopper is on your site or not.\n* `PAYOUT` \u2013 Payment\
            \ details can be used to [make a payout](https://docs.adyen.com/online-payments/online-payouts).\n\
            * `EXTERNAL` - Use this when you store payment details and send the raw\
            \ card number or network token directly in your API request.\n"
          enum:
          - ONECLICK
          - ONECLICK,RECURRING
          - RECURRING
          - PAYOUT
          - EXTERNAL
        recurringDetailName:
          type: string
          description: A descriptive name for this detail.
        recurringExpiry:
          type: string
          format: date-time
          description: Date after which no further authorisations shall be performed.
            Only for 3D Secure 2.
          x-addedInVersion: '40'
        recurringFrequency:
          type: string
          description: Minimum number of days between authorisations. Only for 3D
            Secure 2.
          x-addedInVersion: '40'
        tokenService:
          type: string
          description: The name of the token service.
          enum:
          - VISATOKENSERVICE
          - MCTOKENSERVICE
          - AMEXTOKENSERVICE
          - TOKEN_SHARING
          x-addedInVersion: '25'
    ServiceError:
      type: object
      additionalProperties: false
      properties:
        additionalData:
          type: object
          additionalProperties:
            type: string
          description: Contains additional information about the payment. Some data
            fields are included only if you select them first. Go to **Customer Area**
            > **Developers** > **Additional data**.
          x-addedInVersion: '46'
        errorCode:
          type: string
          description: The error code mapped to the error message.
        errorType:
          type: string
          description: The category of the error.
        message:
          type: string
          description: A short explanation of the issue.
        pspReference:
          type: string
          description: The PSP reference of the payment.
        status:
          type: integer
          format: int32
          description: The HTTP response status.
    ThreeDS2CardRangeDetail:
      type: object
      additionalProperties: false
      properties:
        acsInfoInd:
          type: array
          description: 'Provides additional information to the 3DS Server.

            Possible values:

            - 01 (Authentication is available at ACS)

            - 02 (Attempts supported by ACS or DS)

            - 03 (Decoupled authentication supported)

            - 04 (Whitelisting supported)'
          items:
            type: string
          x-addedInVersion: '51'
        brandCode:
          type: string
          description: Card brand.
        endRange:
          type: string
          description: BIN end range.
        startRange:
          type: string
          description: BIN start range.
        threeDS2Versions:
          type: array
          description: Supported 3D Secure protocol versions
          items:
            type: string
          x-addedInVersion: '53'
        threeDSMethodURL:
          type: string
          description: In a 3D Secure 2 browser-based flow, this is the URL where
            you should send the device fingerprint to.
    ThreeDSAvailabilityRequest:
      type: object
      additionalProperties: false
      properties:
        additionalData:
          type: object
          additionalProperties:
            type: string
          description: 'This field contains additional data, which may be required
            for a particular request.


            The `additionalData` object consists of entries, each of which includes
            the key and value.'
        brands:
          type: array
          description: List of brands.
          items:
            type: string
        cardNumber:
          type: string
          description: Card number or BIN.
        merchantAccount:
          type: string
          description: The merchant account identifier.
        recurringDetailReference:
          type: string
          description: A recurring detail reference corresponding to a card.
        shopperReference:
          type: string
          description: The shopper's reference to uniquely identify this shopper (e.g.
            user ID or account ID).
      required:
      - merchantAccount
    ThreeDSAvailabilityResponse:
      type: object
      additionalProperties: false
      properties:
        binDetails:
          $ref: '#/components/schemas/BinDetail'
          description: Bin Group Details
          x-addedInVersion: '50'
        dsPublicKeys:
          type: array
          description: List of Directory Server (DS) public keys.
          items:
            $ref: '#/components/schemas/DSPublicKeyDetail'
        threeDS1Supported:
          type: boolean
          description: Indicator if 3D Secure 1 is supported.
        threeDS2CardRangeDetails:
          type: array
          description: List of brand and card range pairs.
          items:
            $ref: '#/components/schemas/ThreeDS2CardRangeDetail'
        threeDS2supported:
          type: boolean
          description: Indicator if 3D Secure 2 is supported.
  examples:
    generic-400:
      summary: Response code 400. Bad Request.
      value:
        status: 400
        errorCode: '702'
        message: 'Unexpected input: I'
        errorType: validation
    post-get3dsAvailability-get3dsAvailability:
      summary: Get 3D Secure availability
      description: Example request to check 3D Secure availability
      value:
        merchantAccount: YOUR_MERCHANT_ACCOUNT
        cardNumber: '4111111111111111'
    post-get3dsAvailability-get3dsAvailability-200:
      summary: Example response for request 'get3dsAvailability'
      value:
        threeDS1Supported: true
        threeDS2CardRangeDetails: []
        threeDS2supported: false
    post-getCostEstimate-getCostEstimate:
      summary: Estimate the transaction cost
      description: Example request to get the estimated cost of a transaction
      value:
        amount:
          value: 1234
          currency: EUR
        assumptions:
          assumeLevel3Data: true
          assume3DSecureAuthenticated: true
        cardNumber: '5101180000000007'
        merchantAccount: YOUR_MERCHANT_ACCOUNT
        merchantDetails:
          countryCode: NL
          mcc: '7411'
          enrolledIn3DSecure: true
        shopperInteraction: Ecommerce
    post-getCostEstimate-getCostEstimate-200:
      summary: Example response for request 'getCostEstimate'
      value:
        costEstimateAmount:
          currency: EUR
          value: 12
        resultCode: Success
    post-getCostEstimate-getCostEstimateEncryptedCard:
      summary: Estimate the transaction cost using an encrypted card number
      description: Example request to get the estimated cost of a transaction
      value:
        amount:
          value: 1234
          currency: EUR
        assumptions:
          assumeLevel3Data: true
          assume3DSecureAuthenticated: true
        encryptedCardNumber: test_5101180000000007
        merchantAccount: YOUR_MERCHANT_ACCOUNT
        merchantDetails:
          countryCode: NL
          mcc: '7411'
          enrolledIn3DSecure: true
        shopperInteraction: Ecommerce
    post-getCostEstimate-getCostEstimateEncryptedCard-200:
      summary: Example response for request 'getCostEstimateEncryptedCard'
      value:
        costEstimateAmount:
          currency: EUR
          value: 12
        resultCode: Success
    post-getCostEstimate-getCostEstimateMinimal:
      summary: Estimate the transaction cost (minimal)
      description: Example request to get the estimated cost of a transaction with
        minimum details
      value:
        amount:
          value: 1234
          currency: EUR
        cardNumber: '5101180000000007'
        merchantAccount: YOUR_MERCHANT_ACCOUNT
    post-getCostEstimate-getCostEstimateMinimal-200:
      summary: Example response for request 'getCostEstimateMinimal'
      value:
        costEstimateAmount:
          currency: EUR
          value: 12
        resultCode: Success
    post-getCostEstimate-getCostEstimateMinimal3DS:
      summary: Estimate the transaction cost (minimal with 3DSecure)
      description: Example request to get the estimated cost of a 3D Secure transaction
        with minimum details
      value:
        amount:
          value: 1234
          currency: EUR
        assumptions:
          assumeLevel3Data: true
          assume3DSecureAuthenticated: true
        cardNumber: '5101180000000007'
        merchantAccount: YOUR_MERCHANT_ACCOUNT
    post-getCostEstimate-getCostEstimateMinimal3DS-200:
      summary: Example response for request 'getCostEstimateMinimal3DS'
      value:
        costEstimateAmount:
          currency: EUR
          value: 12
        resultCode: Success
    post-getCostEstimate-getCostEstimateRecurringContract:
      summary: Estimate the transaction cost (recurring contract)
      description: Example request to get the estimated cost of a recurring transaction
      value:
        amount:
          value: 1234
          currency: EUR
        assumptions:
          assumeLevel3Data: true
          assume3DSecureAuthenticated: true
        merchantAccount: YOUR_MERCHANT_ACCOUNT
        merchantDetails:
          countryCode: NL
          mcc: '7411'
          enrolledIn3DSecure: true
        selectedRecurringDetailReference: '1234567890123456'
        shopperInteraction: Ecommerce
        shopperReference: '123456'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    BasicAuth:
      type: http
      scheme: basic
