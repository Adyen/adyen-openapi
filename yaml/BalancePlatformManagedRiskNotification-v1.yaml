openapi: 3.1.0
info:
  title: Managed risk webhooks
  description: 'Adyen sends these webhooks to inform you when we adjust the risk measures
    applied to your account holders'' payouts, based on their risk level.


    These measures include settlement delays, rolling reserves, and reserve waivers.


    These webhooks are sent to customers that use Adyen [Managed Risk](https://docs.adyen.com/platforms/managed-risk/).'
  termsOfService: https://www.adyen.com/legal/terms-and-conditions
  contact:
    name: Adyen Developer Experience team
    url: https://github.com/Adyen/adyen-openapi
  version: '1'
tags:
- name: Managed Risk
webhooks:
  balancePlatform.managedRisk.balance.block.released:
    post:
      tags:
      - Managed Risk
      summary: Blocked funds released
      description: Adyen sends this webhook when funds that were previously blocked
        are released, making them available.
      operationId: post-balancePlatform.managedRisk.balance.block.released
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskBalanceBlockReleasedNotificationRequest'
            examples:
              balance-block-released:
                summary: Blocked funds released
                description: Funds that were previously blocked are released.
                value:
                  data:
                    accountHolder:
                      description: Account holder for retail operations
                      id: AH00000000000000000001
                      reference: Store_001
                    amount:
                      currency: EUR
                      value: 25000
                    balanceAccount:
                      description: Main operating account
                      id: BA00000000000000000001
                      reference: OP_ACCT_MAIN
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    batchReference: BATCH_REF_20250925
                    blockedBalanceAfter:
                      currency: EUR
                      value: -75000
                    blockedBalanceBefore:
                      currency: EUR
                      value: -100000
                    creationDate: '2025-09-25T14:30:00Z'
                    valueDate: '2025-09-25T14:35:00Z'
                  environment: test
                  timestamp: '2025-09-25T14:35:00Z'
                  type: balancePlatform.managedRisk.balance.block.released
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskBalanceBlockReleased
      x-sortIndex: 0
  balancePlatform.managedRisk.reserveWaiver.applied:
    post:
      tags:
      - Managed Risk
      summary: Reserve waiver applied
      description: Adyen sends this webhook when we apply a reserve waiver to your
        account holder, so that reserves are no longer withheld from their payouts.
      operationId: post-balancePlatform.managedRisk.reserveWaiver.applied
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskReserveWaiverAppliedNotificationRequest'
            examples:
              reserve-waiver-applied:
                summary: Reserve waiver applied
                description: A reserve waiver was applied to the account holder.
                value:
                  data:
                    accountHolderId: AH00000000000000000001
                    eventDate: '2025-01-19'
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    id: '9313547924908349'
                  environment: test
                  type: balancePlatform.managedRisk.reserveWaiver.applied
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskReserveWaiverApplied
      x-sortIndex: 0
  balancePlatform.managedRisk.reserveWaiver.removed:
    post:
      tags:
      - Managed Risk
      summary: Reserve waiver removed
      description: Adyen sends this webhook when we remove a reserve waiver from your
        account holder, so that reserves are withheld from their payouts again.
      operationId: post-balancePlatform.managedRisk.reserveWaiver.removed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskReserveWaiverRemovedNotificationRequest'
            examples:
              reserve-waiver-removed:
                summary: Reserve waiver removed
                description: A reserve waiver was removed from the account holder.
                value:
                  data:
                    accountHolderId: AH00000000000000000001
                    eventDate: '2025-01-19'
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    id: '9313547924908349'
                  environment: test
                  type: balancePlatform.managedRisk.reserveWaiver.removed
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskReserveWaiverRemoved
      x-sortIndex: 0
  balancePlatform.managedRisk.rollingReserve.applied:
    post:
      tags:
      - Managed Risk
      summary: Rolling reserve applied
      description: Adyen sends this webhook when we apply a rolling reserve policy
        to your account holder's payouts, because of their risk level.
      operationId: post-balancePlatform.managedRisk.rollingReserve.applied
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskRollingReserveAppliedNotificationRequest'
            examples:
              rolling-reserve-applied:
                summary: Rolling reserve applied
                description: A rolling reserve policy was applied to the account holder.
                value:
                  data:
                    accountHolderId: AH00000000000000000001
                    rollingReservePercentage: 10
                    withHoldingPeriodInDays: 30
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    creationDate: '2025-01-19T13:37:38+02:00'
                    id: '9313547924908349'
                  environment: test
                  type: balancePlatform.managedRisk.rollingReserve.applied
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskRollingReserveApplied
      x-sortIndex: 0
  balancePlatform.managedRisk.rollingReserve.lifted:
    post:
      tags:
      - Managed Risk
      summary: Rolling reserve lifted
      description: Adyen sends this webhook when we lift a rolling reserve policy
        from your account holder's payouts.
      operationId: post-balancePlatform.managedRisk.rollingReserve.lifted
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskRollingReserveLiftedNotificationRequest'
            examples:
              rolling-reserve-lifted:
                summary: Rolling reserve lifted
                description: A rolling reserve policy was lifted from the account
                  holder.
                value:
                  data:
                    accountHolderId: AH00000000000000000001
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    creationDate: '2025-01-19T13:37:38+02:00'
                    id: '9313547924908349'
                  environment: test
                  type: balancePlatform.managedRisk.rollingReserve.lifted
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskRollingReserveLifted
      x-sortIndex: 0
  balancePlatform.managedRisk.rollingReserve.updated:
    post:
      tags:
      - Managed Risk
      summary: Rolling reserve updated
      description: Adyen sends this webhook when we update a rolling reserve policy
        applied to your account holder's payouts, because of their risk level.
      operationId: post-balancePlatform.managedRisk.rollingReserve.updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskRollingReserveUpdatedNotificationRequest'
            examples:
              rolling-reserve-updated:
                summary: Rolling reserve updated
                description: An existing rolling reserve policy was updated.
                value:
                  data:
                    accountHolderId: AH00000000000000000001
                    rollingReservePercentage: 15
                    withHoldingPeriodInDays: 45
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    creationDate: '2025-01-19T13:37:38+02:00'
                    id: '9313547924908349'
                  environment: test
                  type: balancePlatform.managedRisk.rollingReserve.updated
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskRollingReserveUpdated
      x-sortIndex: 0
  balancePlatform.managedRisk.settlementDelay.lifted:
    post:
      tags:
      - Managed Risk
      summary: Settlement delay lifted
      description: Adyen sends this webhook when we lift a settlement delay from your
        account holder's payouts after their risk review period has passed.
      operationId: post-balancePlatform.managedRisk.settlementDelay.lifted
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskSettlementDelayLiftedNotificationRequest'
            examples:
              settlement-delay-lifted:
                summary: Settlement delay lifted
                description: The settlement delay was lifted for the account holder.
                value:
                  data:
                    accountHolderId: AH00000000000000000001
                    reason: riskReviewPeriodPassed
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    creationDate: '2025-01-19T13:37:38+02:00'
                    id: '9313547924908349'
                  environment: test
                  type: balancePlatform.managedRisk.settlementDelay.lifted
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskSettlementDelayLifted
      x-sortIndex: 0
  balancePlatform.managedRisk.settlementDelay.updated:
    post:
      tags:
      - Managed Risk
      summary: Settlement delay updated
      description: Adyen sends this webhook when we update the settlement delay for
        your account holder's payouts, because of their risk level.
      operationId: post-balancePlatform.managedRisk.settlementDelay.updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedRiskSettlementDelayNotificationRequest'
            examples:
              settlement-delay-updated:
                summary: Settlement delay updated
                description: The settlement delay was updated for the account holder.
                value:
                  data:
                    accountHolderId: AH00000000000000000001
                    reason: settlementDelayChanged
                    configurations:
                    - paymentMethod: standard
                      settlementDelay: 5
                    balancePlatform: YOUR_BALANCE_PLATFORM
                    creationDate: '2025-01-19T13:37:38+02:00'
                    id: '9313547924908349'
                  environment: test
                  type: balancePlatform.managedRisk.settlementDelay.updated
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePlatformNotificationResponse'
      x-methodName: managedRiskSettlementDelayUpdated
      x-sortIndex: 0
components:
  schemas:
    Amount:
      required:
      - currency
      - value
      type: object
      properties:
        currency:
          type: string
          description: The three-character [ISO currency code](https://docs.adyen.com/development-resources/currency-codes#currency-codes)
            of the amount.
        value:
          type: integer
          description: The numeric value of the amount, in [minor units](https://docs.adyen.com/development-resources/currency-codes#minor-units).
          format: int64
    BalancePlatformNotificationResponse:
      type: object
      properties:
        notificationResponse:
          type: string
          description: Respond with any **2xx** HTTP status code to [accept the webhook](https://docs.adyen.com/development-resources/webhooks/#accept-webhooks).
    ManagedRiskBalanceBlockReleasedNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/ReleaseBlockedBalanceNotificationData'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.balance.block.released
    ManagedRiskReserveWaiverAppliedNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/ReserveWaiverAppliedNotificationResource'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.reserveWaiver.applied
    ManagedRiskReserveWaiverRemovedNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/ReserveWaiverRemovedNotificationResource'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.reserveWaiver.removed
    ManagedRiskRollingReserveAppliedNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/RollingReserveNotificationResource'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.rollingReserve.applied
    ManagedRiskRollingReserveLiftedNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/RollingReserveLiftedNotificationResource'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.rollingReserve.lifted
    ManagedRiskRollingReserveUpdatedNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/RollingReserveNotificationResource'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.rollingReserve.updated
    ManagedRiskSettlementDelayLiftedNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/SettlementDelayLiftedNotificationResource'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.settlementDelay.lifted
    ManagedRiskSettlementDelayNotificationRequest:
      required:
      - data
      - environment
      - type
      type: object
      properties:
        data:
          description: Contains event details.
          $ref: '#/components/schemas/SettlementDelayNotificationResource'
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
          enum:
          - test
          - live
        timestamp:
          type: string
          description: When the event was queued.
          format: date-time
        type:
          type: string
          description: Type of webhook.
          enum:
          - balancePlatform.managedRisk.settlementDelay.updated
    ReleaseBlockedBalanceNotificationData:
      required:
      - accountHolder
      - amount
      - balanceAccount
      type: object
      properties:
        accountHolder:
          description: Contains information about the account holder associated with
            the `balanceAccount`.
          $ref: '#/components/schemas/ResourceReference'
        amount:
          description: The amount released.
          $ref: '#/components/schemas/Amount'
        balanceAccount:
          description: Contains information about the associated balance account.
          $ref: '#/components/schemas/ResourceReference'
        balancePlatform:
          type: string
          description: The unique identifier of the balance platform.
        batchReference:
          type: string
          description: The reference of the batch that was released.
        blockedBalanceAfter:
          description: The new blocked balance after the funds were released.
          $ref: '#/components/schemas/Amount'
        blockedBalanceBefore:
          description: The blocked balance before the funds were released.
          $ref: '#/components/schemas/Amount'
        creationDate:
          type: string
          description: The date and time when the event was triggered, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
        id:
          type: string
          description: The ID of the resource.
          readOnly: true
        valueDate:
          type: string
          description: The date and time when the amount was released, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
    ReserveWaiverAppliedNotificationResource:
      required:
      - accountHolderId
      - eventDate
      type: object
      properties:
        accountHolderId:
          type: string
          description: The unique identifier of the account holder whose reserves
            will be waived.
        balancePlatform:
          type: string
          description: The unique identifier of the balance platform.
        creationDate:
          type: string
          description: The date and time when the event was triggered, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
        eventDate:
          type: string
          description: The date in which a reserve waiver has been applied to this
            account.
          format: date
        id:
          type: string
          description: The ID of the resource.
          readOnly: true
    ReserveWaiverRemovedNotificationResource:
      required:
      - accountHolderId
      - eventDate
      type: object
      properties:
        accountHolderId:
          type: string
          description: The unique identifier of the account holder whose reserves
            will no longer be waived.
        balancePlatform:
          type: string
          description: The unique identifier of the balance platform.
        creationDate:
          type: string
          description: The date and time when the event was triggered, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
        eventDate:
          type: string
          description: The date in which a reserve waiver has been removed from this
            account.
          format: date
        id:
          type: string
          description: The ID of the resource.
          readOnly: true
    ResourceReference:
      type: object
      properties:
        description:
          type: string
          description: The description of the resource.
        id:
          type: string
          description: The unique identifier of the resource.
        reference:
          type: string
          description: The reference for the resource.
    RollingReserveLiftedNotificationResource:
      required:
      - accountHolderId
      type: object
      properties:
        accountHolderId:
          type: string
          description: The unique identifier of the account holder whose risk settings
            changed.
        balancePlatform:
          type: string
          description: The unique identifier of the balance platform.
        creationDate:
          type: string
          description: The date and time when the event was triggered, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
        id:
          type: string
          description: The ID of the resource.
          readOnly: true
    RollingReserveNotificationResource:
      required:
      - accountHolderId
      - rollingReservePercentage
      - withHoldingPeriodInDays
      type: object
      properties:
        accountHolderId:
          type: string
          description: The unique identifier of the account holder whose risk settings
            changed.
        balancePlatform:
          type: string
          description: The unique identifier of the balance platform.
        creationDate:
          type: string
          description: The date and time when the event was triggered, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
        id:
          type: string
          description: The ID of the resource.
          readOnly: true
        rollingReservePercentage:
          type: integer
          description: The percentage of your user's daily sales volume that is withheld
            from the settlement batch as a rolling reserve.
          format: int32
        withHoldingPeriodInDays:
          type: integer
          description: The number of days after which we release the withheld percentage
            of your user's daily sales volume.
          format: int32
    SettlementDelayConfiguration:
      required:
      - paymentMethod
      - settlementDelay
      type: object
      properties:
        paymentMethod:
          type: string
          description: The payment method to which the settlement delay applies.
        settlementDelay:
          type: integer
          description: The updated settlement delay applied to your user's transactions.
            It indicates the number of days after which your user's funds become available
            in their balance account.
          format: int32
    SettlementDelayLiftedNotificationResource:
      required:
      - accountHolderId
      - reason
      type: object
      properties:
        accountHolderId:
          type: string
          description: The unique identifier of the account holder whose risk settings
            changed.
        balancePlatform:
          type: string
          description: The unique identifier of the balance platform.
        creationDate:
          type: string
          description: The date and time when the event was triggered, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
        id:
          type: string
          description: The ID of the resource.
          readOnly: true
        reason:
          type: string
          description: 'The reason for the change in your account holder''s settlement
            delay.


            Possible values: **paymentProcessingEnabled**, **settlementDelayChanged**,
            **riskReviewPeriodPassed**.'
          enum:
          - paymentProcessingEnabled
          - settlementDelayChanged
          - riskReviewPeriodPassed
    SettlementDelayNotificationResource:
      required:
      - accountHolderId
      - configurations
      - reason
      type: object
      properties:
        accountHolderId:
          type: string
          description: The unique identifier of the account holder whose risk settings
            changed.
        balancePlatform:
          type: string
          description: The unique identifier of the balance platform.
        configurations:
          type: array
          description: Contains information about the configuration of a settlement
            delay.
          items:
            $ref: '#/components/schemas/SettlementDelayConfiguration'
        creationDate:
          type: string
          description: The date and time when the event was triggered, in ISO 8601
            extended format. For example, **2025-03-19T10:15:30+01:00**.
          format: date-time
        id:
          type: string
          description: The ID of the resource.
          readOnly: true
        reason:
          type: string
          description: 'The reason for the change in your account holder''s settlement
            delay.


            Possible values: **paymentProcessingEnabled**, **settlementDelayChanged**,
            **riskReviewPeriodPassed**.'
          enum:
          - paymentProcessingEnabled
          - settlementDelayChanged
          - riskReviewPeriodPassed
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    BasicAuth:
      type: http
      scheme: basic
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
