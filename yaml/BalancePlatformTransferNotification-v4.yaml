openapi: 3.1.0
info:
  title: Transfer webhooks
  description: 'Adyen sends webhooks to inform your system about incoming and outgoing
    transfers in your platform.


    You can use these webhooks to build your implementation. For example, you can
    use this information to update balances in your own dashboards or to keep track
    of incoming funds.'
  termsOfService: https://www.adyen.com/legal/terms-and-conditions
  contact:
    name: Adyen Developer Experience team
    url: https://github.com/Adyen/adyen-openapi
  version: '4'
  x-publicVersion: true
tags:
- name: General
components:
  schemas:
    AULocalAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        accountNumber:
          type: string
          description: The bank account number, without separators or whitespace.
          maxLength: 9
          minLength: 5
        bsbCode:
          type: string
          description: The 6-digit [Bank State Branch (BSB) code](https://en.wikipedia.org/wiki/Bank_state_branch),
            without separators or whitespace.
          maxLength: 6
          minLength: 6
        type:
          type: string
          default: auLocal
          description: '**auLocal**'
          enum:
          - auLocal
      required:
      - accountNumber
      - bsbCode
      - type
    AdditionalBankIdentification:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: The value of the additional bank identification.
        type:
          type: string
          description: "The type of additional bank identification, depending on the\
            \ country.\n\nPossible values:\n\n * **auBsbCode**: The 6-digit [Australian\
            \ Bank State Branch (BSB) code](https://en.wikipedia.org/wiki/Bank_state_branch),\
            \ without separators or spaces.\n * **caRoutingNumber**: The 9-digit [Canadian\
            \ routing number](https://en.wikipedia.org/wiki/Routing_number_(Canada)),\
            \ in EFT format, without separators or spaces.\n * **gbSortCode**: The\
            \ 6-digit [UK sort code](https://en.wikipedia.org/wiki/Sort_code), without\
            \ separators or spaces\n * **usRoutingNumber**: The 9-digit [routing number](https://en.wikipedia.org/wiki/ABA_routing_transit_number),\
            \ without separators or spaces."
          enum:
          - auBsbCode
          - caRoutingNumber
          - gbSortCode
          - usRoutingNumber
    Address:
      type: object
      additionalProperties: false
      properties:
        city:
          type: string
          description: "The name of the city.\n\nSupported characters: **[a-z] [A-Z]\
            \ [0-9] . - \u2014 / # , \u2019 \xB0 ( ) : ; [ ] & \\ |** and Space.\n\
            \n> Required when the `category` is **card**.\n"
          minLength: 3
        country:
          type: string
          description: The two-character ISO 3166-1 alpha-2 country code. For example,
            **US**, **NL**, or **GB**.
        line1:
          type: string
          description: "The first line of the street address.\n\nSupported characters:\
            \ **[a-z] [A-Z] [0-9] . - \u2014 / # , \u2019 \xB0 ( ) : ; [ ] & \\ |**\
            \ and Space.\n\n> Required when the `category` is **card**.\n"
        line2:
          type: string
          description: "The second line of the street address.\n\nSupported characters:\
            \ **[a-z] [A-Z] [0-9] . - \u2014 / # , \u2019 \xB0 ( ) : ; [ ] & \\ |**\
            \ and Space.\n\n> Required when the `category` is **card**.\n"
        postalCode:
          type: string
          description: 'The postal code.

            Maximum length:

            * 5 digits for an address in the US.

            * 10 characters for an address in all other countries.


            Supported characters: **[a-z] [A-Z] [0-9]** and Space.


            > Required for addresses in the US.

            '
          minLength: 3
        stateOrProvince:
          type: string
          description: "   The two-letter ISO 3166-2 state or province code. For example,\
            \ **CA** in the US or **ON** in Canada.\n\n   > Required for the US and\
            \ Canada.\n"
      required:
      - country
    Airline:
      type: object
      additionalProperties: false
      properties:
        legs:
          type: array
          description: Details about the flight legs for this ticket.
          items:
            $ref: '#/components/schemas/Leg'
        ticketNumber:
          type: string
          description: The ticket's unique identifier
    Amount:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          description: The three-character [ISO currency code](https://docs.adyen.com/development-resources/currency-codes#currency-codes)
            of the amount.
          maxLength: 3
          minLength: 3
        value:
          type: integer
          format: int64
          description: The numeric value of the amount, in [minor units](https://docs.adyen.com/development-resources/currency-codes#minor-units).
      required:
      - currency
      - value
    AmountAdjustment:
      type: object
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
          description: The adjustment amount.
          x-addedInVersion: '3'
        amountAdjustmentType:
          type: string
          description: 'The type of markup that is applied to an authorised payment.


            Possible values: **exchange**, **forexMarkup**, **authHoldReserve**, **atmMarkup**.'
          enum:
          - atmMarkup
          - authHoldReserve
          - exchange
          - forexMarkup
          x-addedInVersion: '3'
        basepoints:
          type: integer
          format: int32
          description: The basepoints associated with the applied markup.
          x-addedInVersion: '3'
    BRLocalAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        accountNumber:
          type: string
          description: The bank account number, without separators or whitespace.
          maxLength: 10
          minLength: 1
        bankCode:
          type: string
          description: The 3-digit bank code, with leading zeros.
          maxLength: 3
          minLength: 3
        branchNumber:
          type: string
          description: The bank account branch number, without separators or whitespace.
          maxLength: 4
          minLength: 1
        ispb:
          type: string
          description: The 8-digit ISPB, with leading zeros.
          maxLength: 8
          minLength: 8
        type:
          type: string
          default: brLocal
          description: '**brLocal**'
          enum:
          - brLocal
      required:
      - accountNumber
      - bankCode
      - branchNumber
      - type
    BalanceMutation:
      type: object
      additionalProperties: false
      properties:
        balance:
          type: integer
          format: int64
          description: The amount in the payment's currency that is debited or credited
            on the balance accounting register.
          x-addedInVersion: '3'
        currency:
          type: string
          description: The three-character [ISO currency code](https://docs.adyen.com/development-resources/currency-codes).
          x-addedInVersion: '3'
        received:
          type: integer
          format: int64
          description: The amount in the payment's currency that is debited or credited
            on the received accounting register.
          x-addedInVersion: '3'
        reserved:
          type: integer
          format: int64
          description: The amount in the payment's currency that is debited or credited
            on the reserved accounting register.
          x-addedInVersion: '3'
    BalancePlatformNotificationResponse:
      type: object
      additionalProperties: false
      properties:
        notificationResponse:
          type: string
          description: Respond with any **2xx** HTTP status code to [accept the webhook](https://docs.adyen.com/development-resources/webhooks/#accept-webhooks).
    BankAccountV3:
      type: object
      additionalProperties: false
      properties:
        accountHolder:
          $ref: '#/components/schemas/PartyIdentification'
          description: Information about the owner of the bank account.
        accountIdentification:
          description: Contains the bank account details. The fields required in this
            object depend on the country of the bank account and the currency of the
            transfer.
          discriminator:
            propertyName: type
            mapping:
              iban: '#/components/schemas/IbanAccountIdentification'
              numberAndBic: '#/components/schemas/NumberAndBicAccountIdentification'
              auLocal: '#/components/schemas/AULocalAccountIdentification'
              czLocal: '#/components/schemas/CZLocalAccountIdentification'
              noLocal: '#/components/schemas/NOLocalAccountIdentification'
              plLocal: '#/components/schemas/PLLocalAccountIdentification'
              huLocal: '#/components/schemas/HULocalAccountIdentification'
              seLocal: '#/components/schemas/SELocalAccountIdentification'
              sgLocal: '#/components/schemas/SGLocalAccountIdentification'
              ukLocal: '#/components/schemas/UKLocalAccountIdentification'
              usLocal: '#/components/schemas/USLocalAccountIdentification'
              brLocal: '#/components/schemas/BRLocalAccountIdentification'
              dkLocal: '#/components/schemas/DKLocalAccountIdentification'
              caLocal: '#/components/schemas/CALocalAccountIdentification'
              nzLocal: '#/components/schemas/NZLocalAccountIdentification'
              hkLocal: '#/components/schemas/HKLocalAccountIdentification'
          oneOf:
          - $ref: '#/components/schemas/AULocalAccountIdentification'
          - $ref: '#/components/schemas/BRLocalAccountIdentification'
          - $ref: '#/components/schemas/CALocalAccountIdentification'
          - $ref: '#/components/schemas/CZLocalAccountIdentification'
          - $ref: '#/components/schemas/DKLocalAccountIdentification'
          - $ref: '#/components/schemas/HKLocalAccountIdentification'
          - $ref: '#/components/schemas/HULocalAccountIdentification'
          - $ref: '#/components/schemas/IbanAccountIdentification'
          - $ref: '#/components/schemas/NOLocalAccountIdentification'
          - $ref: '#/components/schemas/NZLocalAccountIdentification'
          - $ref: '#/components/schemas/NumberAndBicAccountIdentification'
          - $ref: '#/components/schemas/PLLocalAccountIdentification'
          - $ref: '#/components/schemas/SELocalAccountIdentification'
          - $ref: '#/components/schemas/SGLocalAccountIdentification'
          - $ref: '#/components/schemas/UKLocalAccountIdentification'
          - $ref: '#/components/schemas/USLocalAccountIdentification'
        storedPaymentMethodId:
          type: string
          description: The unique token that identifies the stored bank account details
            of the counterparty for a payout.
      required:
      - accountHolder
      - accountIdentification
    BankCategoryData:
      type: object
      additionalProperties: false
      properties:
        priority:
          type: string
          description: 'The priority for the bank transfer. This sets the speed at
            which the transfer is sent and the fees that you have to pay. Required
            for transfers with `category` **bank**.


            Possible values:


            * **regular**: For normal, low-value transactions.


            * **fast**: A faster way to transfer funds, but the fees are higher. Recommended
            for high-priority, low-value transactions.


            * **wire**: The fastest way to transfer funds, but this has the highest
            fees. Recommended for high-priority, high-value transactions.


            * **instant**: For instant funds transfers within the United States and
            in [SEPA locations](https://www.ecb.europa.eu/paym/integration/retail/sepa/html/index.en.html).


            * **crossBorder**: For high-value transfers to a recipient in a different
            country.


            * **internal**: For transfers to an Adyen-issued business bank account
            (by bank account number/IBAN).'
          enum:
          - crossBorder
          - fast
          - instant
          - internal
          - regular
          - wire
          x-addedInVersion: '4'
        type:
          type: string
          default: bank
          description: '**bank**'
          enum:
          - bank
    CALocalAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        accountNumber:
          type: string
          description: The 5- to 12-digit bank account number, without separators
            or whitespace.
          maxLength: 12
          minLength: 5
        accountType:
          type: string
          default: checking
          description: 'The bank account type.


            Possible values: **checking** or **savings**. Defaults to **checking**.'
          enum:
          - checking
          - savings
        institutionNumber:
          type: string
          description: The 3-digit institution number, without separators or whitespace.
          maxLength: 3
          minLength: 3
        transitNumber:
          type: string
          description: The 5-digit transit number, without separators or whitespace.
          maxLength: 5
          minLength: 5
        type:
          type: string
          default: caLocal
          description: '**caLocal**'
          enum:
          - caLocal
      required:
      - accountNumber
      - institutionNumber
      - transitNumber
      - type
    CZLocalAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        accountNumber:
          type: string
          description: "The 2- to 16-digit bank account number (\u010C\xEDslo \xFA\
            \u010Dtu) in the following format:\n\n- The optional prefix (p\u0159ed\u010D\
            \xEDsl\xED).\n\n- The required second part (z\xE1kladn\xED \u010D\xE1\
            st) which must be at least two non-zero digits.\n\nExamples:\n\n- **19-123457**\
            \ (with prefix)\n\n- **123457** (without prefix)\n\n- **000019-0000123457**\
            \ (with prefix, normalized)\n\n- **000000-0000123457** (without prefix,\
            \ normalized)"
          maxLength: 17
          minLength: 2
        bankCode:
          type: string
          description: "The 4-digit bank code (K\xF3d banky), without separators or\
            \ whitespace."
          maxLength: 4
          minLength: 4
        type:
          type: string
          default: czLocal
          description: '**czLocal**'
          enum:
          - czLocal
      required:
      - accountNumber
      - bankCode
      - type
    Card:
      type: object
      additionalProperties: false
      properties:
        cardHolder:
          $ref: '#/components/schemas/PartyIdentification'
          description: Contains information about the cardholder.
        cardIdentification:
          $ref: '#/components/schemas/CardIdentification'
          description: Contains the identification details of the card.
      required:
      - cardHolder
      - cardIdentification
    CardIdentification:
      type: object
      additionalProperties: false
      properties:
        expiryMonth:
          type: string
          description: 'The expiry month of the card.


            Format: two digits. Add a leading zero for single-digit months. For example:

            * 03 = March

            * 11 = November'
          maxLength: 2
          minLength: 2
        expiryYear:
          type: string
          description: 'The expiry year of the card.


            Format: four digits. For example: 2020'
          maxLength: 4
          minLength: 4
        issueNumber:
          type: string
          description: The issue number of the card. Applies only to some UK debit
            cards.
          maxLength: 2
          minLength: 1
        number:
          type: string
          description: 'The card number without any separators.


            For security, the response only includes the last four digits of the card
            number.'
          maxLength: 19
          minLength: 4
        startMonth:
          type: string
          description: 'The month when the card was issued. Applies only to some UK
            debit cards.


            Format: two digits. Add a leading zero for single-digit months. For example:

            * 03 = March

            * 11 = November'
          maxLength: 2
          minLength: 2
        startYear:
          type: string
          description: 'The year when the card was issued. Applies only to some UK
            debit cards.


            Format: four digits. For example: 2020'
          maxLength: 4
          minLength: 4
        storedPaymentMethodId:
          type: string
          description: 'The unique [token](/payouts/payout-service/pay-out-to-cards/manage-card-information#save-card-details)
            created to identify the counterparty.


            '
    ConfirmationTrackingData:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: "The status of the transfer.\n\nPossible values:\n\n - **credited**:\
            \ the funds are credited to your user's transfer instrument or bank account.-\
            \ **accepted**: the request is accepted by the integration."
          enum:
          - credited
          - accepted
        type:
          type: string
          default: confirmation
          description: "The type of the tracking event.\n\nPossible values:\n\n -\
            \ **confirmation**: the transfer passed Adyen's internal review."
          enum:
          - confirmation
      required:
      - status
      - type
    CounterpartyV3:
      type: object
      additionalProperties: false
      properties:
        balanceAccountId:
          type: string
          description: The unique identifier of the counterparty [balance account](https://docs.adyen.com/api-explorer/balanceplatform/latest/post/balanceAccounts#responses-200-id).
        bankAccount:
          $ref: '#/components/schemas/BankAccountV3'
          description: Contains information about the counterparty bank account.
        card:
          $ref: '#/components/schemas/Card'
          description: Contains information about the counterparty card.
        merchant:
          $ref: '#/components/schemas/MerchantData'
          description: Contains information about the merchant.
        transferInstrumentId:
          type: string
          description: The unique identifier of the counterparty [transfer instrument](https://docs.adyen.com/api-explorer/legalentity/latest/post/transferInstruments#responses-200-id).
    DKLocalAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        accountNumber:
          type: string
          description: The 4-10 digits bank account number (Kontonummer) (without
            separators or whitespace).
          maxLength: 10
          minLength: 4
        bankCode:
          type: string
          description: The 4-digit bank code (Registreringsnummer) (without separators
            or whitespace).
          maxLength: 4
          minLength: 4
        type:
          type: string
          default: dkLocal
          description: '**dkLocal**'
          enum:
          - dkLocal
      required:
      - accountNumber
      - bankCode
      - type
    DirectDebitInformation:
      type: object
      additionalProperties: false
      properties:
        dateOfSignature:
          type: string
          format: date-time
          description: The date when the direct debit mandate was accepted by your
            user, in [ISO-8601](https://www.w3.org/TR/NOTE-datetime) format.
        dueDate:
          type: string
          format: date-time
          description: The date when the funds are deducted from your user's balance
            account.
        mandateId:
          type: string
          description: Your unique identifier for the direct debit mandate.
        sequenceType:
          type: string
          description: 'Identifies the direct debit transfer''s type.

            Possible values: **OneOff**, **First**, **Recurring**, **Final**.'
    EstimationTrackingData:
      type: object
      additionalProperties: false
      properties:
        estimatedArrivalTime:
          type: string
          format: date-time
          description: The estimated time the beneficiary should have access to the
            funds.
        type:
          type: string
          default: estimation
          description: "The type of tracking event. \n\nPossible values: \n\n- **estimation**:\
            \ the estimated date and time of when the funds will be credited has been\
            \ determined."
          enum:
          - estimation
      required:
      - estimatedArrivalTime
      - type
    ExecutionDate:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: 'The date when the transfer will be processed. This date must
            be:

            * Within 30 days of the current date.

            * In the [ISO 8601 format](https://www.iso.org/iso-8601-date-and-time-format.html)
            **YYYY-MM-DD**. For example: 2025-01-31'
        timezone:
          type: string
          description: "The timezone that applies to the execution date. Use a timezone\
            \ identifier from the [tz database](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).\n\
            \nExample: **America/Los_Angeles**.\n Default value: **Europe/Amsterdam**."
    ExternalReason:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: The reason code.
        description:
          type: string
          description: The description of the reason code.
        namespace:
          type: string
          description: The namespace for the reason code.
    FundingInstrument:
      type: object
      additionalProperties: false
      properties:
        cardIdentification:
          $ref: '#/components/schemas/CardIdentification'
          description: "Card details used for the transfer, such as the Primary Account\
            \ Number (PAN) or stored payment method ID. Required if `sourceOfFunds`\
            \ is **DEBIT**. Provide either:\n - `storedPaymentMethodId` or \n - `expiryMonth`,\
            \ `expiryYear`, and `number`."
        networkPaymentReference:
          type: string
          description: The unique reference assigned by the card network for the pay-in
            transaction.
        reference:
          type: string
          description: Your internal reference that identifies this funding instrument.
            Required if `sourceOfFunds` is **DEPOSIT_ACCOUNT**.
        sourceOfFunds:
          type: string
          description: 'Indicates where the funds used for the transfer originated.
            Possible values are:

            - **DEBIT** for card-to-card transfers.

            - **DEPOSIT_ACCOUNT** for wallet-to-card transfers.'
          enum:
          - DEBIT
          - DEPOSIT_ACCOUNT
    HKLocalAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        accountNumber:
          type: string
          description: The 9- to 17-digit bank account number, without separators
            or whitespace. Starts with the 3-digit branch code.
          maxLength: 17
          minLength: 9
        clearingCode:
          type: string
          description: The 3-digit clearing code, without separators or whitespace.
          maxLength: 3
          minLength: 3
        type:
          type: string
          default: hkLocal
          description: '**hkLocal**'
          enum:
          - hkLocal
      required:
      - accountNumber
      - clearingCode
      - type
    HULocalAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        accountNumber:
          type: string
          description: The 24-digit bank account number, without separators or whitespace.
          maxLength: 24
          minLength: 24
        type:
          type: string
          default: huLocal
          description: '**huLocal**'
          enum:
          - huLocal
      required:
      - accountNumber
      - type
    IbanAccountIdentification:
      type: object
      additionalProperties: false
      properties:
        bic:
          type: string
          description: The bank's 8- or 11-character BIC or SWIFT code.
        iban:
          type: string
          description: The international bank account number as defined in the [ISO-13616](https://www.iso.org/standard/81090.html)
            standard.
        type:
          type: string
          default: iban
          description: '**iban**'
          enum:
          - iban
      required:
      - iban
      - type
    InterchangeData:
      type: object
      additionalProperties: false
      properties:
        interchangeAmount:
          $ref: '#/components/schemas/Amount'
          description: The currency and value of the adjusted interchange fee.
        interchangeRateIndicator:
          type: string
          description: A 3-character alphanumeric code assigned by Visa that identifies
            the specific interchange reimbursement program a transaction qualified
            for. The code is assigned based on the card type, entry mode, and security
            data provided.
        type:
          type: string
          default: interchangeData
          description: "The type of events data. \n\nPossible values: \n\n - **interchangeData**:\
            \ information about the interchange fee applied to a transaction."
          enum:
          - interchangeData
      required:
      - type
    InternalCategoryData:
      type: object
      additionalProperties: false
      properties:
        modificationMerchantReference:
          type: string
          description: The capture's merchant reference included in the transfer.
          x-addedInVersion: '4'
        modificationPspReference:
          type: string
          description: The capture reference included in the transfer.
          x-addedInVersion: '4'
        type:
          type: string
          default: internal
          description: '**internal**'
          enum:
          - internal
    InternalReviewTrackingData:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: "The reason why the transfer failed Adyen's internal review.\
            \ \n\nPossible values:\n\n- **refusedForRegulatoryReasons**: the transfer\
            \ does not comply with Adyen's risk policy. For more information, [contact\
            \ the Support Team](https://www.adyen.help/hc/en-us/requests/new). "
          enum:
          - refusedForRegulatoryReasons
        status:
          type: string
          description: "The status of the transfer.\n\nPossible values:\n\n - **pending**:\
            \ the transfer is under internal review by Adyen.\n\n- **failed**: the\
            \ transfer failed Adyen's internal review. For details, see `reason`.\n\
            \n"
          enum:
          - pending
          - failed
        type:
          type: string
          default: internalReview
          description: "The type of tracking event. \n\nPossible values: \n\n - **internalReview**:\
            \ the transfer was flagged because it does not comply with Adyen's risk\
            \ policy."
          enum:
          - internalReview
      required:
      - status
      - type
    IssuedCard:
      type: object
      additionalProperties: false
      properties:
        authorisationType:
          type: string
          description: The authorisation type. For example, **defaultAuthorisation**,
            **preAuthorisation**, **finalAuthorisation**
          x-addedInVersion: '4'
        networkVariant:
          type: string
          description: The card variant associated with the payment network used to
            route or process the transaction. For single-network cards, this matches
            the `brandVariant`. For US dual-network cards routed over an alternate
            network, this value reflects the specific tier or sub-type under that
            processing network.
          enum:
          - maestro_us
          - mastercard
          - visa
          x-addedInVersion: '4'
        panEntryMode:
          type: string
          description: 'Indicates the method used for entering the PAN to initiate
            a transaction.


            Possible values: **manual**, **chip**, **magstripe**, **contactless**,
            **cof**, **ecommerce**, **token**.'
          enum:
          - chip
          - cof
          - contactless
          - ecommerce
          - magstripe
          - manual
          - token
          x-addedInVersion: '4'
        processingType:
          type: string
          description: 'Contains information about how the payment was processed.


            Possible values: **atmWithdraw**, **balanceInquiry**, **ecommerce**, **moto**,
            **pos**, **purchaseWithCashback**, **recurring**, **token**.'
          enum:
          - atmWithdraw
          - balanceInquiry
          - ecommerce
          - moto
          - pos
          - purchaseWithCashback
          - recurring
          - token
          x-addedInVersion: '4'
        relayedAuthorisationData:
