      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferNotificationRequest'
            examples:
              balancePlatform-transfer-created-incoming-internal:
                $ref: '#/components/examples/post-balancePlatform.transfer.created-balancePlatform-transfer-created-incoming-internal'
              balancePlatform-transfer-created-initiated-on-demand-top-up:
                $ref: '#/components/examples/post-balancePlatform.transfer.created-balancePlatform-transfer-created-initiated-on-demand-top-up'
