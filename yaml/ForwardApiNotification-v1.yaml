openapi: 3.1.0
info:
  title: Forward API webhook
  description: 'The Forward API sends payment requests to third-party services on
    your behalf.


    Adyen uses webhooks to notify you about the result of Forward API requests.'
  termsOfService: https://www.adyen.com/legal/terms-and-conditions
  contact:
    name: Adyen Developer Experience team
    url: https://github.com/Adyen/adyen-openapi
  version: '1'
  x-publicVersion: true
tags:
- name: General
components:
  schemas:
    ForwardApiNotificationData:
      type: object
      additionalProperties: false
      properties:
        amountCurrency:
          type: string
          description: The three-character [ISO currency code](https://docs.adyen.com/development-resources/currency-codes).
        amountValue:
          type: integer
          format: int64
          description: The amount of the transaction, in [minor units](https://docs.adyen.com/development-resources/currency-codes).
        eventDateTime:
          type: string
          format: date-time
          description: The transaction date and time.
        externalNetworkTxReferenceFound:
          type: boolean
          description: Indicates if the `networkTxReferencePaths` matched a reference
            in the third-party response.
        externalNetworkTxReferenceRequested:
          type: boolean
          description: Indicates if a `networkTxReferencePaths` value was provided
            in the request.
        externalPartyResponseBody:
          type: string
          description: The raw response body returned by the third-party service.
        externalPsp:
          type: string
          description: The third-party service that processed the payment request.
        externalPspTransactionStatus:
          type: string
          description: The transaction status returned by the third-party service.
        externalTransactionLinkIdFound:
          type: boolean
          description: Indicates if the `transactionLinkIdPaths` matched a reference
            in the third-party response.
        externalTransactionLinkIdRequested:
          type: boolean
          description: Indicates if a `transactionLinkIdPaths` value was provided
            in the request.
        merchantAccountCode:
          type: string
          description: The merchant account that is used to process the payment.
        merchantCountryCode:
          type: string
          description: The country of the merchant account.
        merchantReference:
          type: string
          description: Your reference to uniquely identify the payment.
        pspReference:
          type: string
          description: Adyen's 16-character reference associated with the request.
            This value is globally unique, so you can use it as the reference when
            you communicate with us about this request.
        scheme:
          type: string
          description: The card network used for the transaction. For example, **visa**
            or **mc**.
        shopperReference:
          type: string
          description: Your reference to uniquely identify this shopper, for example
            user ID or account ID.
        storedPaymentMethodId:
          type: string
          description: The unique identifier of the token.
      required:
      - eventDateTime
      - externalPsp
      - merchantAccountCode
      - merchantCountryCode
      - merchantReference
      - pspReference
      - scheme
      - shopperReference
      - storedPaymentMethodId
    ForwardApiNotificationRequest:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          type: string
          format: date-time
          description: The date and time when the webhook was created.
        data:
          $ref: '#/components/schemas/ForwardApiNotificationData'
          description: The details of the Forward API request.
        environment:
          type: string
          description: 'The environment from which the webhook originated.


            Possible values: **test**, **live**.'
        type:
          type: string
          description: The type of notification.
        version:
          type: string
          description: The version of this webhook type.
      required:
      - createdAt
      - type
    ForwardApiNotificationResponse:
      type: object
      additionalProperties: false
      properties:
        notificationResponse:
          type: string
          description: Respond with any **2xx** HTTP status code to [accept the webhook](https://docs.adyen.com/development-resources/webhooks/#accept-webhooks).
  examples:
    post-forwardApi.notification-recurring-forwardApi.notification:
      summary: Forward Api Request
      value:
        type: forwardApi.notification
        version: '1'
        createdAt: '2023-02-27T16:14:06+01:00'
        environment: test
        data:
          pspReference: QFQTPCQ8HXSKGK82
          shopperReference: YOUR_SHOPPER_REFERENCE
          storedPaymentMethodId: M5N7TQ4TG5PFWR50
          scheme: visa
          externalPsp: adyen
          merchantReference: YOUR_ORDER_REFERENCE
          externalPspTransactionStatus: Authorised
          eventDateTime: '2023-02-27T16:14:06+01:00'
          merchantAccountCode: YOUR_MERCHANT_ACCOUNT
          merchantCountryCode: NL
          amountValue: 100
          amountCurrency: EUR
          externalPartyResponseBody: '{"status": "success"}'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
webhooks:
  forwardApi.notification:
    post:
      tags:
      - General
      summary: Forward API request completed
      description: Adyen forwarded a payment request to the third-party service on
        your behalf.
      operationId: post-forwardApi.notification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardApiNotificationRequest'
            examples:
              recurring-forwardApi.notification:
                $ref: '#/components/examples/post-forwardApi.notification-recurring-forwardApi.notification'
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForwardApiNotificationResponse'
      security:
      - BasicAuth: []
      x-sortIndex: 0
      x-methodName: forwardApiRequestCompleted
