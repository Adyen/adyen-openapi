openapi: 3.1.0
info:
  title: Raise disputes API
  description: "Disputes API for Issuing that you can use to raise disputes on transactions\
    \ made with an Adyen-issued card, or to report instances of fraud. You can also\
    \ add attachments as supporting information for a raised dispute, update information\
    \ about the dispute, submit the dispute for a chargeback, or close the dispute.\n\
    \n## Authentication\nYour Adyen contact will provide your API credential and an\
    \ API key. To connect to the API, add an `X-API-Key` header with the API key as\
    \ the value, for example:\n\n ```\ncurl\n-H \"Content-Type: application/json\"\
    \ \\\n-H \"X-API-Key: YOUR_API_KEY\" \\\n...\n```\n\nAlternatively, you can use\
    \ the username and password to connect to the API using basic authentication.\
    \ For example:\n\n```\ncurl\n-H \"Content-Type: application/json\" \\\n-U \"ws@BalancePlatform.YOUR_BALANCE_PLATFORM\"\
    :\"YOUR_WS_PASSWORD\" \\\n...\n```\n## Roles and permissions\nTo use the Disputes\
    \ API, you need an additional role for your API credential. Your Adyen contact\
    \ will set up the roles and permissions for you.\n## Versioning\nThe Disputes\
    \ API supports [versioning](https://docs.adyen.com/development-resources/versioning)\
    \ using a version suffix in the endpoint URL. This suffix has the following format:\
    \ \"vXX\", where XX is the version number.\n\nFor example:\n```\nhttps://balanceplatform-api-test.adyen.com/btl/api/v{version}/disputes\n\
    ```\n## Going live\nWhen going live, your Adyen contact will provide your API\
    \ credential for the live environment. You can then use the username and password\
    \ to send requests to `https://balanceplatform-api-live.adyen.com/btl/api/v{version}`.\n\
    \n"
  termsOfService: https://www.adyen.com/legal/terms-and-conditions
  contact:
    name: Adyen Developer Experience team
    url: https://github.com/Adyen/adyen-openapi
  version: '3'
servers:
- url: https://balanceplatform-api-test.adyen.com/btl/api/v3
  description: Test Environment
- url: https://balanceplatform-api-live.adyen.com/btl/api/v3
  description: Live Environment
tags:
- name: Dispute Attachments
- name: Raise Disputes
paths:
  /disputes:
    get:
      tags:
      - Raise Disputes
      summary: Get a list of raised disputes
      description: 'Returns a list of raised disputes that match the query parameters.


        This endpoint supports cursor-based pagination. The response returns the first
        page of results, and returns links to the next page when applicable. You can
        use the links to page through the results. The response also returns links
        to the previous page when applicable.'
      operationId: get-disputes
      parameters:
      - name: status
        in: query
        description: 'The current status of the dispute.


          Possible values: **draft**, **submitted**, **closed**, **won**, **chargeback**,
          **secondPresentment**.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: paymentInstrument
        in: query
        description: The unique identifier of the payment instrument.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: createdSince
        in: query
        description: Only include disputes that have been created on or after this
          point in time. The value must be in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601\)  format.
          For example, 2021-05-30T15:07:40Z.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: createdUntil
        in: query
        description: Only include disputes that have been created on or before this
          point in time. The value must be in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601\)
          format. For example, **2021-05-30T15:07:40Z**.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: offset
        in: query
        description: The number of items that you want to skip.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The number of items returned per page, maximum of 500 items.
          By default, the response returns 100 items per page.
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/DisputeResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-group-parameters: 'false'
      x-methodName: getAllDisputes
      x-sortIndex: 1
    post:
      tags:
      - Raise Disputes
      summary: Raise a dispute
      description: 'Raise a dispute for an underlying transaction, providing a dispute
        type and the amount you want to dispute.


        Raising a dispute returns a dispute ID, which you can use to update details
        about the dispute, provide supporting documentation, close the dispute, or
        submit the dispute for a chargeback. You can also use the dispute ID to view
        the status of the dispute.'
      operationId: post-disputes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-methodName: createDispute
      x-sortIndex: 1
  /disputes/{disputeId}/attachments:
    get:
      tags:
      - Dispute Attachments
      summary: Get all attachments linked to a raised dispute
      description: Get a list of attachments associated with a dispute ID.
      operationId: get-disputes-disputeId-attachments
      parameters:
      - name: disputeId
        in: path
        description: The unique identifier of the raised dispute.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisputeAttachment'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-methodName: getAllAttachments
      x-sortIndex: 2
    post:
      tags:
      - Dispute Attachments
      summary: Add an attachment to a dispute
      description: Add supporting information as an attachment for the raised dispute.
        Upload receipts, communication, or any other documentation to support the
        dispute.
      operationId: post-disputes-disputeId-attachments
      parameters:
      - name: disputeId
        in: path
        description: The unique identifier of the raised dispute.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeAttachment'
        required: true
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachDocumentResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-methodName: createAttachment
      x-sortIndex: 2
  /disputes/{disputeId}/attachments/{attachmentId}:
    get:
      tags:
      - Dispute Attachments
      summary: Get an attachment
      description: Search for a single attachment, providing the specific dispute
        ID and attachment ID.
      operationId: get-disputes-disputeId-attachments-attachmentId
      parameters:
      - name: disputeId
        in: path
        description: The unique identifier of the raised dispute.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: attachmentId
        in: path
        description: The unique identifier of the attachment.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeAttachment'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-methodName: getAttachment
      x-sortIndex: 2
    delete:
      tags:
      - Dispute Attachments
      summary: Delete attachment from a dispute
      description: Removes the attachment from the raised dispute. Adyen may keep
        this file for compliance purposes.
      operationId: delete-disputes-disputeId-attachments-attachmentId
      parameters:
      - name: disputeId
        in: path
        description: The unique identifier of the raised dispute.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: attachmentId
        in: path
        description: The unique identifier of the attachment.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: The attachment was successfully removed
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-methodName: deleteAttachment
      x-sortIndex: 2
  /disputes/{id}:
    get:
      tags:
      - Raise Disputes
      summary: Get dispute by ID
      description: Get a raised dispute by ID.
      operationId: get-disputes-id
      parameters:
      - name: id
        in: path
        description: The unique identifier of the raised dispute.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-methodName: getDispute
      x-sortIndex: 1
    patch:
      tags:
      - Raise Disputes
      summary: Update a raised dispute
      description: 'Update information related to a raised dispute, or change a dispute''s
        status from **draft** to **submitted** or **closed**.


        **Note:** Changing the status of a dispute to **submitted** or **closed**
        is a final action. You cannot make updates to a **submitted** or **closed**
        dispute. Make sure to upload all supporting attachments using the `POST /disputes/{id}/attachments`
        endpoint before you submit a dispute. When you update a dispute to **submitted**,
        Adyen sends the raised dispute to the card scheme for review and acquirer
        defense. When you update a raised dispute to **closed**, Adyen closes the
        dispute, and the dispute is no longer eligible for review by the card scheme.'
      operationId: patch-disputes-id
      parameters:
      - name: id
        in: path
        description: The unique identifier of the raised dispute.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchableDisputeRequest'
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '403':
          description: Insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
        '422':
          description: A request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponseEntity'
      x-methodName: updateDispute
      x-sortIndex: 1
components:
  schemas:
    Amount:
      type: object
      properties:
        currency:
          type: string
          description: The three-character [ISO currency code](https://docs.adyen.com/development-resources/currency-codes#currency-codes)
            of the amount.
        value:
          type: integer
          format: int64
          description: The numeric value of the amount, in [minor units](https://docs.adyen.com/development-resources/currency-codes#minor-units).
      required:
      - currency
      - value
    AttachDocumentResponse:
      type: object
      properties:
        attachmentId:
          type: string
          description: The unique identifier of the attachment.
          readOnly: true
    AttachmentType:
      type: string
      enum:
      - receipt
      - correspondence
      - other
    CancelledInfo:
      type: object
      properties:
        attemptedToReturn:
          type: boolean
          description: 'Indicates if the cardholder attempted to return the merchandise
            but was unable to.


            Possible values: **true**, **false**.


            Required if the value of `didCardholderReturn` is **false**.


            If the value of this parameter is **true**, provide information in `descriptionOfIssue`
            about how the cardholder attempted to return the goods, and what they
            did with the goods (for example, destroyed them).'
        certificationGuaranteedReservation:
          $ref: '#/components/schemas/CertificationGuaranteedReservation'
          description: "The certification code for the guaranteed reservation.\n\n\
            Required if the value of `serviceType` is **guaranteedReservation** (a\
            \ guaranteed reservation).\n\nPossible values:\n\n * **GR**: The cardholder\
            \ properly cancelled the guaranteed reservation.\n\n * **RC**: The cardholder\
            \ attempted to cancel within 24 hours of delivery of the reservation confirmation.\n\
            \n * **AR**: The merchant billed a \"no-show transaction\" for more than\
            \ one day's accommodation or rental."
        dateOfAttemptedReturn:
          type: string
          format: date
          description: 'The date, in **YYYY-MM-DD** format, when the cardholder attempted
            to return the goods they purchased.


            Required if the value of `attemptedToReturn` is **true**.'
        dateOfCancellation:
          type: string
          format: date
          description: 'The date, in **YYYY-MM-DD** format, when the purchase was
            cancelled.


            Required if the value of `certificationGuaranteedReservation` is **GR**
            or **RC**, or if the value of `didCardholderCancelBeforeShipment` is **true**.'
        dateOfReturn:
          type: string
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the cardholder shipped
            or handed back the merchandise.


            Required if the value of `didCardholderReturn` is **true**.'
        dateOfService:
          type: string
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the service was scheduled
            to take place.


            Required if the value of `serviceType` is **other** (any other type of
            service) or **guaranteedReservation** (a guaranteed reservation).'
        dateReturnReceived:
          type: string
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the merchant received
            the returned merchandise.


            Required if the value of `didCardholderReturn` is **true**.'
        descriptionOfIssue:
          type: string
          description: "Your description of the issue for raising a dispute of `type`\
            \ **cancelled**. Make sure the cardholder provides information that covers\
            \ the following:\n\n * A description of the goods or services purchased,\
            \ and why they are cancelling the purchase.\n\n * If the goods or services\
            \ were cancelled before shipment: A description of how the cardholder\
            \ attempted to cancel the goods or services.\n\n * If the cardholder attempted\
            \ to return the goods: A description of how the cardholder attempted to\
            \ return the goods, and what they did with the goods (for example, destroyed\
            \ them).\n\n * If the cardholder attempted to return the goods in a way\
            \ other than through direct return shipment or face-to-face return at\
            \ a merchant, how they attempted to return the goods.\n\nNot required\
            \ if the value of `goodsOrServices` is **services**, the value of `serviceType`\
            \ is **timeshare** or **guaranteedReservation**, and the value of `didCardholderCancelBeforeShipment`\
            \ is **false**."
          maxLength: 2500
          minLength: 0
        didCardholderCancelBeforeShipment:
          type: boolean
          description: 'Indicates if the cardholder cancelled the purchase before
            the goods were shipped.


            Possible values: **true**, **false**.


            If the value of this parameter is **true**, provide information in `descriptionOfIssue`
            about how the cardholder attempted to cancel the goods or services.'
        didCardholderReceiveGoods:
          type: boolean
          description: 'Indicates if the cardholder received the merchandise.


            Possible values: **true**, **false**.


            Required if the value of `goodsOrServices` is **goods**.'
        didCardholderReturn:
          type: boolean
          description: 'Indicates if the cardholder returned the merchandise to the
            merchant.


            Possible values: **true**, **false**.


            Required if the value of `didCardholderReceiveGoods` is **true**.'
        goodsOrServices:
          $ref: '#/components/schemas/ProductType'
          description: 'The type of purchase being disputed.


            Possible values: **goods**, **services**.'
        lastExpectedDate:
          type: string
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the merchant promised
            delivery.


            Required if the value of `goodsOrServices` is **goods**.'
        merchantRefuseAdvise:
          $ref: '#/components/schemas/MerchantRefuseAdvise'
          description: "The reason the merchant gave for refusing the return.\n\n\
            Required if the value of `attemptedToReturn` is **true**.\n\nPossible\
            \ values:\n\n * **MRRA**: The merchant refused to provide return authorization.\n\
            \n * **MRRM**: The merchant refused to accept returned merchandise.\n\n\
            \ * **MICNRM**: The merchant informed cardholder not to return the merchandise."
        returnMethod:
          $ref: '#/components/schemas/ReturnMethod'
          description: 'The method used to return the merchandise.


            Required if the value of `didCardholderReturn` is **true**.


            Possible values: **faceToFace**, **fedEx**, **dhl**, **ups**, **postalService**,
            **other**.


            If the value of this parameter is **other**, or if the cardholder attempted
            a return but did not complete it, provide information in `descriptionOfIssue`
            about how the cardholder attempted to return the goods or services.'
        serviceType:
          $ref: '#/components/schemas/ServiceType'
          description: "The type of service purchased.\n\nRequired if the value of\
            \ `goodsOrServices` is **services**.\n\nPossible values:\n\n * **timeshare**:\
            \ A reservation for a timeshare.\n\n * **guaranteedReservation**: A guaranteed\
            \ reservation (for example, a hotel or a car rental booking).\n\n * **other**:\
            \ Any other type of service."
        shippingTrackingNumber:
          type: string
          description: The tracking number for the shipment used to return the merchandise.
          maxLength: 50
          minLength: 0
        timeshareDate:
          type: string
          format: date
          description: 'The date, in **YYYY-MM-DD** format, associated with the timeshare
            purchase.


            Required if the value of `serviceType` is **timeshare**.'
        wasCancellationPolicyProvided:
          type: boolean
          description: 'Indicates if the merchant provided the cardholder with a cancellation
            policy.


            Possible values: **true**, **false**.


            Required if the value of `didCardholderReceiveGoods` is **false**, the
            value of `didCardholderCancelBeforeShipment` is **true**, or the value
            of `serviceType` is **guaranteedReservation**.'
        whoCancelled:
          $ref: '#/components/schemas/CancellingEntity'
          description: 'The party that initiated the cancellation of the purchase.


            Required if the value of `serviceType` is **timeshare** (a timeshare)
            or **other** (any other type of service), or if the value of `didCardholderReceiveGoods`
            is **false**.


            Possible values: **merchant**, **cardholder**.'
      required:
      - goodsOrServices
    CancelledInfoUpdate:
      type: object
      properties:
        attemptedToReturn:
          type:
          - boolean
          - 'null'
          description: 'Indicates if the cardholder attempted to return the merchandise
            but was unable to.


            Possible values: **true**, **false**.


            Required if the value of `didCardholderReturn` is **false**.


            If the value of this parameter is **true**, provide information in `descriptionOfIssue`
            about how the cardholder attempted to return the goods, and what they
            did with the goods (for example, destroyed them).'
        certificationGuaranteedReservation:
          type: object
          description: "The certification code for the guaranteed reservation.\n\n\
            Required if the value of `serviceType` is **guaranteedReservation** (a\
            \ guaranteed reservation).\n\nPossible values:\n\n * **GR**: The cardholder\
            \ properly cancelled the guaranteed reservation.\n\n * **RC**: The cardholder\
            \ attempted to cancel within 24 hours of delivery of the reservation confirmation.\n\
            \n * **AR**: The merchant billed a \"no-show transaction\" for more than\
            \ one day's accommodation or rental."
          oneOf:
          - $ref: '#/components/schemas/CertificationGuaranteedReservation'
          - type: 'null'
        dateOfAttemptedReturn:
          type:
          - string
          - 'null'
          format: date
          description: 'The date, in **YYYY-MM-DD** format, when the cardholder attempted
            to return the goods they purchased.


            Required if the value of `attemptedToReturn` is **true**.'
        dateOfCancellation:
          type:
          - string
          - 'null'
          format: date
          description: 'The date, in **YYYY-MM-DD** format, when the purchase was
            cancelled.


            Required if the value of `certificationGuaranteedReservation` is **GR**
            or **RC**, or if the value of `didCardholderCancelBeforeShipment` is **true**.'
        dateOfReturn:
          type:
          - string
          - 'null'
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the cardholder shipped
            or handed back the merchandise.


            Required if the value of `didCardholderReturn` is **true**.'
        dateOfService:
          type:
          - string
          - 'null'
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the service was scheduled
            to take place.


            Required if the value of `serviceType` is **other** (any other type of
            service) or **guaranteedReservation** (a guaranteed reservation).'
        dateReturnReceived:
          type:
          - string
          - 'null'
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the merchant received
            the returned merchandise.


            Required if the value of `didCardholderReturn` is **true**.'
        descriptionOfIssue:
          type:
          - string
          - 'null'
          description: "Your description of the issue for raising a dispute of `type`\
            \ **cancelled**. Make sure the cardholder provides information that covers\
            \ the following:\n\n * A description of the goods or services purchased,\
            \ and why they are cancelling the purchase.\n\n * If the goods or services\
            \ were cancelled before shipment: A description of how the cardholder\
            \ attempted to cancel the goods or services.\n\n * If the cardholder attempted\
            \ to return the goods: A description of how the cardholder attempted to\
            \ return the goods, and what they did with the goods (for example, destroyed\
            \ them).\n\n * If the cardholder attempted to return the goods in a way\
            \ other than through direct return shipment or face-to-face return at\
            \ a merchant, how they attempted to return the goods.\n\nNot required\
            \ if the value of `goodsOrServices` is **services**, the value of `serviceType`\
            \ is **timeshare** or **guaranteedReservation**, and the value of `didCardholderCancelBeforeShipment`\
            \ is **false**."
          maxLength: 2500
          minLength: 0
        didCardholderCancelBeforeShipment:
          type:
          - boolean
          - 'null'
          description: 'Indicates if the cardholder cancelled the purchase before
            the goods were shipped.


            Possible values: **true**, **false**.


            If the value of this parameter is **true**, provide information in `descriptionOfIssue`
            about how the cardholder attempted to cancel the goods or services.'
        didCardholderReceiveGoods:
          type:
          - boolean
          - 'null'
          description: 'Indicates if the cardholder received the merchandise.


            Possible values: **true**, **false**.


            Required if the value of `goodsOrServices` is **goods**.'
        didCardholderReturn:
          type:
          - boolean
          - 'null'
          description: 'Indicates if the cardholder returned the merchandise to the
            merchant.


            Possible values: **true**, **false**.


            Required if the value of `didCardholderReceiveGoods` is **true**.'
        goodsOrServices:
          $ref: '#/components/schemas/ProductType'
          description: 'The type of purchase being disputed.


            Possible values: **goods**, **services**.'
        lastExpectedDate:
          type:
          - string
          - 'null'
          format: date
          description: 'The date, in **YYYY-MM-DD** format, that the merchant promised
            delivery.


            Required if the value of `goodsOrServices` is **goods**.'
        merchantRefuseAdvise:
          type: object
          description: "The reason the merchant gave for refusing the return.\n\n\
            Required if the value of `attemptedToReturn` is **true**.\n\nPossible\
            \ values:\n\n * **MRRA**: The merchant refused to provide return authorization.\n\
            \n * **MRRM**: The merchant refused to accept returned merchandise.\n\n\
            \ * **MICNRM**: The merchant informed cardholder not to return the merchandise."
          oneOf:
          - $ref: '#/components/schemas/MerchantRefuseAdvise'
          - type: 'null'
        returnMethod:
          type: object
          description: 'The method used to return the merchandise.


            Required if the value of `didCardholderReturn` is **true**.


            Possible values: **faceToFace**, **fedEx**, **dhl**, **ups**, **postalService**,
            **other**.


            If the value of this parameter is **other**, or if the cardholder attempted
            a return but did not complete it, provide information in `descriptionOfIssue`
            about how the cardholder attempted to return the goods or services.'
          oneOf:
          - $ref: '#/components/schemas/ReturnMethod'
          - type: 'null'
        serviceType:
          type: object
          description: "The type of service purchased.\n\nRequired if the value of\
            \ `goodsOrServices` is **services**.\n\nPossible values:\n\n * **timeshare**:\
            \ A reservation for a timeshare.\n\n * **guaranteedReservation**: A guaranteed\
            \ reservation (for example, a hotel or a car rental booking).\n\n * **other**:\
            \ Any other type of service."
          oneOf:
          - $ref: '#/components/schemas/ServiceType'
          - type: 'null'
        shippingTrackingNumber:
          type:
          - string
          - 'null'
          description: The tracking number for the shipment used to return the merchandise.
          maxLength: 50
          minLength: 0
        timeshareDate:
          type:
          - string
          - 'null'
          format: date
          description: 'The date, in **YYYY-MM-DD** format, associated with the timeshare
            purchase.


            Required if the value of `serviceType` is **timeshare**.'
        wasCancellationPolicyProvided:
          type:
          - boolean
          - 'null'
          description: 'Indicates if the merchant provided the cardholder with a cancellation
            policy.


            Possible values: **true**, **false**.


            Required if the value of `didCardholderReceiveGoods` is **false**, the
            value of `didCardholderCancelBeforeShipment` is **true**, or the value
            of `serviceType` is **guaranteedReservation**.'
        whoCancelled:
          type: object
          description: 'The party that initiated the cancellation of the purchase.


            Required if the value of `serviceType` is **timeshare** (a timeshare)
            or **other** (any other type of service), or if the value of `didCardholderReceiveGoods`
            is **false**.


            Possible values: **merchant**, **cardholder**.'
          oneOf:
          - $ref: '#/components/schemas/CancellingEntity'
          - type: 'null'
