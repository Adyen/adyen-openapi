          type: string
          format: date
          description: The date, in **YYYY-MM-DD** format, when the goods or services
            were cancelled by the cardholder. Required if the value of `whoCancelled`
            is **cardholder**.
        dateOfFirstNegotiations:
          type: string
          format: date
          description: The date, in **YYYY-MM-DD** format, that negotiations with
