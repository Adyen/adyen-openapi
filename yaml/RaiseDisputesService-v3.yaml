          type: string
          format: date
          description: The date, in **YYYY-MM-DD** format, when the cardholder shipped
            or handed back the merchandise to the merchant. Required if the value
            of `didCardholderReturn` is **true**.
        dateReturnReceived:
          type: string
          format: date
          description: The date, in **YYYY-MM-DD** format, when the merchant received
            the returned merchandise. Required if the value of `didCardholderReturn`
            is **true**.
        descriptionOfIssue:
          type: string
          description: "Your description of the issue for raising a dispute of `type`\
            \ **notAsDescribed**. Make sure the cardholder provides information that\
            \ covers the following:\n\n * A description of the goods or services purchased,\
            \ and why they did not fit the description of what they thought they purchased.\n\
            \n * If the cardholder cancelled services that they purchased: A description\
            \ of how the services were cancelled.\n\n * If the cardholder attempted\
            \ to negotiate a resolution: A description of the negotiations that took\
            \ place with the merchant.\n\n * If the goods or services were cancelled\
            \ before shipment: A description of how the cardholder attempted to cancel\
            \ the goods or services.\n\n * If the cardholder attempted to return the\
            \ goods: A description of how the cardholder attempted to return the goods\
            \ and what they did with the goods (for example, destroyed them)."
          maxLength: 2500
          minLength: 0
        didAttemptToResolve:
          type: boolean
          description: 'Indicates if the cardholder attempted to resolve the issue
            directly with the merchant before raising the dispute.


            Possible values: **true**, **false**.'
        didCardholderReturn:
          type: boolean
          description: 'Indicates if the cardholder returned the merchandise to the
            merchant. Required if the value of `goodsOrServices` is **goods**, or
            if the value of `disputeDueTo` is **defectiveMerchandise**.


            Possible values: **true**, **false**.'
        didMerchantAcceptCancellation:
          type: boolean
          description: 'Indicates if the merchant accepted the cancellation. Required
            if the cardholder cancelled the service within 15 days of the current
            date.


            Possible values: **true**, **false**.'
        disputeDueTo:
          $ref: '#/components/schemas/DisputeDueTo'
          description: 'Indicates the kind of dispute being raised by the cardholder.


            Possible values: **notAsDescribed**, **defectiveMerchandise**.'
        evidenceOfNegotiationsWithMerchant:
          type: boolean
          description: 'Indicates if the cardholder attempted to negotiate a resolution
            with the merchant before raising the dispute. Required if more than 120
            days have passed since both the `lastExpectedDate` and the transaction
            processing date.


            Possible values: **true**, **false**.


            If the value of this parameter is **true**, provide information in `descriptionOfIssue`
            about the negotiations that took place with the merchant.'
        goodsOrServices:
          $ref: '#/components/schemas/ProductType'
          description: 'The type of purchase being disputed. Required if the value
            of `disputeDueTo` is **notAsDescribed**.


            Possible values: **goods**, **services**.'
        isNonFiatOrNft:
          type: boolean
          description: 'Indicates if the transaction is non-fiat or non-fungible token
            (NFT) related. Required if the value of `goodsOrServices` is **services**.


            Possible values: **true**, **false**.'
        lastExpectedDate:
          type: string
          format: date
          description: The date, in **YYYY-MM-DD** format, that the merchant promised
            delivery of the goods or services.
        reasonMerchantRefused:
          $ref: '#/components/schemas/NotAsDescribedMerchantRefuseAdvise'
          description: "The reason the merchant gave for refusing the return. Required\
            \ if the value of `attemptedToReturn` is **true**.\n\nPossible values:\n\
            \n * **MRRA**: The merchant refused to provide return authorization.\n\
            \n * **MRRM**: The merchant refused to accept the returned merchandise.\n\
            \n * **MICNRM**: The merchant told the cardholder not to return the merchandise.\n\
            \n * **MNLER**: The merchant no longer exists or is not responding.\n\n\
            \ * **MNPCIR**: The merchant did not provide clear instructions on how\
            \ to return the merchandise."
        resolutionProhibitedByLaw:
          type: boolean
          description: 'Indicates if local law prohibits the cardholder from attempting
            to resolve the issue with the merchant. Required if the value of `didAttemptToResolve`
            is **false**. If this value is also **false**, the dispute cannot proceed.


            Possible values: **true**, **false**.'
        returnMethod:
          $ref: '#/components/schemas/ReturnMethod'
          description: 'The method used to return the merchandise. Required if the
            value of `didCardholderReturn` is **true**.


            Possible values: **faceToFace**, **fedEx**, **dhl**, **ups**, **postalService**,
            **other**.


            If the value of this parameter is **other**, provide information in `descriptionOfIssue`
            about how the merchandise was returned.'
        shippingTrackingNumber:
          type: string
          description: The tracking number for the shipment used to return the merchandise.
          maxLength: 50
          minLength: 0
        whoCancelled:
          $ref: '#/components/schemas/CancellingEntity'
          description: 'The party that initiated cancellation of the service. Required
            if the value of `goodsOrServices` is **services**.


            Possible values: **merchant**, **cardholder**.


            If the value of this parameter is **cardholder**, provide information
            in `descriptionOfIssue` about how the service was cancelled.'
      required:
      - descriptionOfIssue
      - didAttemptToResolve
      - disputeDueTo
