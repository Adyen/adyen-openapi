          x-addedInVersion: '40'
        threeDS2Result:
          $ref: '#/components/schemas/ThreeDS2Result'
          description: The ThreeDS2Result that was returned in the final CRes.
        threeDS2Token:
          type: string
          description: The ThreeDS2Token that was returned in the /authorise call.
        threeDSAuthenticationOnly:
