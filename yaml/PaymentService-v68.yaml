paths:
  /adjustAuthorisation:
    post:
      tags:
      - Modifications
      summary: Change the authorised amount
      description: 'Allows you to increase or decrease the authorised amount after
        the initial authorisation has taken place. This functionality enables for
        example tipping, improving the chances your authorisation will be valid, or
        charging the shopper when they have already left the merchant premises.


        > This endpoint is [inactive](https://docs.adyen.com/online-payments/upgrade-your-integration#checkout-api-lifecycle)
        and is no longer supported for new integrations.

        > * If you are building a new integration, use the Checkout API [`/payments/{paymentPspReference}/amountUpdates`](https://docs.adyen.com/api-explorer/Checkout/latest/post/payments/(paymentPspReference)/amountUpdates)
        endpoint instead.

        > * If you have an existing integration using this endpoint, reach out to
        your Adyen contact and [migrate to the Checkout API](https://docs.adyen.com/online-payments/upgrade-your-integration/migrate-to-checkout-api).


        >The Checkout API enables your [online payments](https://docs.adyen.com/online-payments)
        integration to accept all supported payment methods, use the latest features,
        and access more benefits.'
      operationId: post-adjustAuthorisation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustAuthorisationRequest'
            examples:
              adjustAuthorisation:
                $ref: '#/components/examples/post-adjustAuthorisation-adjustAuthorisation'
      responses:
        '200':
          description: OK - the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModificationResult'
              examples:
                adjustAuthorisation:
                  $ref: '#/components/examples/post-adjustAuthorisation-adjustAuthorisation-200'
        '400':
          description: Bad Request - a problem reading or understanding the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
              examples:
                generic:
                  $ref: '#/components/examples/generic-400'
        '401':
          description: Unauthorized - authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
              examples:
                generic:
                  $ref: '#/components/examples/generic-401'
        '403':
          description: Forbidden - insufficient permissions to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '422':
          description: Unprocessable Entity - a request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '500':
          description: Internal Server Error - the server could not process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
              examples:
                generic:
                  $ref: '#/components/examples/generic-500'
      security:
      - BasicAuth: []
      - ApiKeyAuth: []
      x-addedInVersion: '30'
      x-sortIndex: 6
      x-methodName: adjustAuthorisation
