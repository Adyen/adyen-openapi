  /capture:
    post:
      tags:
      - Modifications
      summary: Capture an authorisation
      description: 'Captures the authorisation hold on a payment, returning a unique
        reference for this request. Usually the full authorisation amount is captured,
        however it''s also possible to capture a smaller amount, which results in
        cancelling the remaining authorisation balance.


        Payment methods that are captured automatically after authorisation don''t
        need to be captured. However, submitting a capture request on these transactions
        will not result in double charges. If immediate or delayed auto-capture is
        enabled, calling the capture method is not necessary.


        For more information refer to [Capture](https://docs.adyen.com/online-payments/classic-integrations/modify-payments/capture).


        > This endpoint is [inactive](https://docs.adyen.com/online-payments/upgrade-your-integration#checkout-api-lifecycle)
        and is no longer supported for new integrations.

        > * If you are building a new integration, use the Checkout API [`/payments/{paymentPspReference}/captures`](https://docs.adyen.com/api-explorer/Checkout/latest/post/payments/(paymentPspReference)/captures)
        endpoint instead.

        > * If you have an existing integration using this endpoint, reach out to
        your Adyen contact and [migrate to the Checkout API](https://docs.adyen.com/online-payments/upgrade-your-integration/migrate-to-checkout-api).


        > The Checkout API enables your [online payments](https://docs.adyen.com/online-payments)
        integration to accept all supported payment methods, use the latest features,
        and access more benefits.'
      operationId: post-capture
      requestBody:
        content:
          application/json:
            schema:
